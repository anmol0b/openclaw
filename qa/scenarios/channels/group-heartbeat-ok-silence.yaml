title: Group token-only HEARTBEAT_OK stays silent

scenario:
  id: group-heartbeat-ok-silence
  surface: channel
  coverage:
    secondary: [channels.outbound-group-reply]
  objective: Verify an ordinary group turn whose final is only the legacy HEARTBEAT_OK token ends silently instead of posting a missing-answer notice, while the next visible answer in the same room still posts.
  successCriteria:
    - The HEARTBEAT_OK turn posts nothing to the group.
    - The following visible-answer turn in the same room posts its marker, and it is the room's only post.
  docsRefs:
    - docs/gateway/heartbeat.md
    - docs/channels/groups.md
  codeRefs:
    - src/agents/agent-run-terminal-reply.ts
    - src/auto-reply/reply/agent-runner-result-payloads.ts
  execution:
    kind: flow
    summary: Send a group turn answered with token-only HEARTBEAT_OK, then a visible-answer turn in the same room; the room must contain only the visible answer.
    config:
      conversationId: qa-heartbeat-ok-room
      silentSnippet: qa group heartbeat ok silence check
      silentPrompt: "@openclaw qa group heartbeat ok silence check. Nothing to add here, reply with exact marker: `HEARTBEAT_OK`"
      controlPrompt: "@openclaw qa group heartbeat ok control check. exact marker: `QA-GROUP-HEARTBEAT-CONTROL-OK`"
      controlMarker: QA-GROUP-HEARTBEAT-CONTROL-OK

flow:
  steps:
    - name: token-only HEARTBEAT_OK posts nothing before the next answer
      actions:
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - set: requestCursorBefore
          value:
            expr: "env.mock ? (await fetchJson(`${env.mock.baseUrl}/debug/request-cursor`)).cursor : 0"
        - sendInbound:
            conversation:
              id:
                expr: config.conversationId
              kind: group
              title: QA Heartbeat OK Room
            senderId: alice
            senderName: Alice
            text:
              expr: config.silentPrompt
        - call: waitForCondition
          args:
            - lambda:
                async: true
                expr: "!env.mock || fetchJson(`${env.mock.baseUrl}/debug/requests?after=${requestCursorBefore}`).then((requests) => requests.some((request) => String(request.allInputText ?? '').includes(config.silentSnippet)))"
            - expr: liveTurnTimeoutMs(env, 180000)
            - 100
        # Same-session turns settle in order, so any notice for the silent
        # turn is posted before the control answer.
        - sendInbound:
            conversation:
              id:
                expr: config.conversationId
              kind: group
              title: QA Heartbeat OK Room
            senderId: alice
            senderName: Alice
            text:
              expr: config.controlPrompt
        - call: waitForOutboundMessage
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.conversation.id === config.conversationId && candidate.text.includes(config.controlMarker)"
            - expr: liveTurnTimeoutMs(env, 180000)
        - set: posts
          value:
            expr: "state.getSnapshot().messages.filter((message) => message.direction === 'outbound' && message.conversation.id === config.conversationId)"
        - assert:
            expr: "posts.length === 1"
            message:
              expr: "`expected only the control post, saw ${JSON.stringify(posts.map((message) => message.text))}`"
      detailsExpr: "JSON.stringify({ posts: posts.map((message) => message.text) })"
